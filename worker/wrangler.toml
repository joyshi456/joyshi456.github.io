name = "enjoyshi-events"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# D1 database binding. Fill database_id after running:
#   npx wrangler d1 create enjoyshi-events
[[d1_databases]]
binding = "DB"
database_name = "enjoyshi-events"
database_id = "841c48bf-e3d3-471d-b551-9e41f6c53021"

# In the Twilio console, open your phone number and copy its E.164 value
# (e.g. +1212XXXXXXX) into the TWILIO_FROM secret below.
#
# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put TWILIO_ACCOUNT_SID   # AC...
#   npx wrangler secret put TWILIO_AUTH_TOKEN    # secret — never commit/paste in chat
#   npx wrangler secret put TWILIO_FROM          # +1212XXXXXXX (the number for the PN SID above)
